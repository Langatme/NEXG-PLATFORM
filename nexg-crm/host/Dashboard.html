<html lang="en">

  <?!= NEXG_include('Theme'); ?>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0b0b0e; }
    body { font-family: "Inter", Arial, sans-serif; color: #edf2fb; font-size: 13px; }
    .nxd { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }
    .nxd-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .nxd-brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .nxd-brand svg { height: 30px; width: auto; }
    .nxd-brand .sub { font-style: italic; font-size: 12px; color: #D4AF37; }
    .nxd-live { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #D4AF37; }
    .nxd-live .dot { width: 7px; height: 7px; border-radius: 50%; background: #D4AF37; box-shadow: 0 0 8px #D4AF37; }
    .nxd-clock { font-size: 12px; color: #7e8ca7; font-variant-numeric: tabular-nums; }
    .nxd-btn { background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.3); color: #D4AF37; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .nxd-btn:hover { background: rgba(212,175,55,.18); }
    .nxd-grid { display: grid; gap: 12px; }
    .nxd-hero { grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; }
    .nxd-row5 { grid-template-columns: repeat(5, 1fr); }
    .nxd-row2 { grid-template-columns: 1fr 1fr; }
    .nxd-row3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 900px) { .nxd-hero, .nxd-row5, .nxd-row3 { grid-template-columns: 1fr 1fr; } .nxd-row2 { grid-template-columns: 1fr; } }
    .nxd-card { background: linear-gradient(180deg, #16161c, #101014); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; }
    .nxd-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #D4AF37; text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .nxd-eyebrow::before { content: ""; width: 14px; height: 2px; background: #D4AF37; border-radius: 2px; }
    .nxd-big { font-size: 34px; font-weight: 800; line-height: 1; }
    .nxd-sub { font-size: 11px; color: #7e8ca7; margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
    .nxd-sub2 { font-size: 11px; color: #7e8ca7; margin-top: 4px; }
    .nxd-gold { color: #D4AF37; }
    .nxd-red { color: #ef4444; }
    .nxd-donut-wrap { display: flex; align-items: center; gap: 16px; }
    .nxd-donut { transform: rotate(-90deg); }
    .nxd-flowbar { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; border-radius: 8px; }
    .nxd-flowbar:hover { background: rgba(255,255,255,.03); }
    .nxd-flowbar .lbl { font-size: 11px; color: #b6c2d9; font-weight: 600; }
    .nxd-track { height: 12px; border-radius: 7px; background: rgba(255,255,255,.07); overflow: hidden; }
    .nxd-track > div { height: 100%; border-radius: 7px; background: linear-gradient(90deg, #8a6d1c, #D4AF37, #f0d070); }
    .nxd-count { font-size: 12px; font-weight: 800; text-align: right; }
    .nxd-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .nxd-table th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #7e8ca7; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .nxd-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
    .nxd-table tr:last-child td { border-bottom: none; }
    .nxd-pill { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(62,123,250,.14); color: #7da9ff; }
    .nxd-pill.live { background: rgba(34,197,94,.14); color: #22c55e; }
    .nxd-pill.bad { background: rgba(239,68,68,.14); color: #ef4444; }
    .nxd-pill.warn { background: rgba(245,158,11,.14); color: #f59e0b; }
    .nxd-mbars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
    .nxd-mbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .nxd-mbar > div.bar { width: 100%; border-radius: 5px; background: linear-gradient(180deg, #f0d070, #8a6d1c); min-height: 3px; }
    .nxd-mbar > span { font-size: 9px; color: #7e8ca7; }
    .nxd-foot { margin-top: 16px; display: flex; justify-content: space-between; font-size: 11px; color: #7e8ca7; }
    .nxd-foot .gold { color: #D4AF37; font-style: italic; }
    .nxd-drill { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .nxd-drill.open { display: flex; }
    .nxd-drill-box { background: #141419; border: 1px solid rgba(212,175,55,.25); border-radius: 16px; max-width: 560px; width: 100%; max-height: 80vh; overflow: auto; padding: 20px; }
    .nxd-drill-box h3 { margin: 0 0 4px; font-size: 16px; }
    .nxd-drill-box .x { float: right; background: none; border: none; color: #7e8ca7; font-size: 18px; cursor: pointer; }
    .nxd-err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; border-radius: 12px; padding: 16px; }

<script>
(function () {
  var D = null;

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function tick() {
    var el = document.getElementById('nxdClock');
    if (el) el.textContent = new Date().toLocaleTimeString();
  }
  setInterval(tick, 1000);
  tick();

  function load() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) { D = res.data; render(); }
        else fail(res && res.error ? res.error.message : 'Unknown error.');
      })
      .withFailureHandler(function (err) { fail(err && err.message ? err.message : 'Server error.'); })
      .NEXG_api({ route: 'panel.dashboard', payload: {} });
  }

  function fail(m) {
    document.getElementById('nxdBody').innerHTML = '<div class="nxd-err">' + esc(m) + '</div>';
  }

  function kpi(icon, value, label, sub, tone) {
    return '<div class="nxd-card"><div class="nxd-eyebrow">' + label + '</div>' +
      '<div class="nxd-big' + (tone ? ' nxd-' + tone : '') + '">' + value + '</div>' +
      (sub ? '<div class="nxd-sub2">' + sub + '</div>' : '') + '</div>';
  }

  function donut(pct, big, label, sub) {
    var r = 54, c = 2 * Math.PI * r, off = c * (1 - Math.min(Math.max(pct, 0), 1));
    return '<div class="nxd-card"><div class="nxd-eyebrow">Conversion</div>' +
      '<div class="nxd-donut-wrap"><svg class="nxd-donut" width="120" height="120" viewBox="0 0 120 120">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="11"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#D4AF37" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + (c * Math.min(Math.max(pct, 0), 1)).toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
      '<text x="60" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">' + big + '</text>' +
      '<text x="60" y="76" text-anchor="middle" fill="#D4AF37" font-size="10" font-weight="700">' + esc(label) + '</text>' +
      '</svg><div><div style="font-size:15px;font-weight:800;">' + esc(sub) + '</div></div></div></div>';
  }

  function render() {
    var t = D.totals, inPipe = t.total - t.live - t.archived;
    var conv = t.total ? Math.round((t.live / t.total) * 100) : 0;
    var html = '';

    html += '<div class="nxd-grid nxd-hero">' +
      donut(t.total ? t.live / t.total : 0, conv + '%', 'converted', 'Pipeline → Live') +
      kpi(0, t.total, 'Hosts', 'all time') +
      kpi(0, t.live, 'Live', 'bookable now', 'gold') +
      kpi(0, inPipe, 'In Pipeline', 'active deals') +
      kpi(0, t.archived, 'Archived', 'out of funnel') +
      '</div>';

    html += '<div class="nxd-grid nxd-row5" style="margin-top:12px;">' +
      kpi(0, D.followUpsDueCount, 'Overdue + Due', D.overdueCount + ' overdue', D.overdueCount ? 'red' : '') +
      kpi(0, D.meetingsNext.length, 'Meetings', 'upcoming') +
      kpi(0, D.callsWeek, 'Calls', 'last 7 days') +
      kpi(0, D.emailStats.sent, 'Emails Sent', D.emailStats.failed + ' failed') +
      kpi(0, (D.emailStats.opened || 0), 'Opened', D.emailStats.replied + ' replied') +
      '</div>';

    html += '<div class="nxd-card" style="margin-top:12px;"><div class="nxd-eyebrow">Pipeline · click a stage to drill in</div><div id="nxdFlow">' +
      D.stageFunnel.map(function (s, i) {
        return '<div class="nxd-flowbar" data-stage="' + esc(s.key) + '" data-i="' + i + '">' +
          '<span class="lbl">' + esc(s.label) + '</span><div class="nxd-track"><div style="width:' + flowW(s) + '%"></div></div>' +
          '<span class="nxd-count">' + s.count + '</span></div>';
      }).join('') + '</div></div>';

    html += '<div class="nxd-grid nxd-row3" style="margin-top:12px;">' +
      '<div class="nxd-card"><div class="nxd-eyebrow">Owner Leaderboard</div>' + board() + '</div>' +
      '<div class="nxd-card"><div class="nxd-eyebrow">Momentum · 8 weeks</div>' + momentum() + '</div>' +
      '<div class="nxd-card"><div class="nxd-eyebrow">Overdue Follow-ups</div>' + overdue() + '</div>' +
      '</div>';

    html += '<div class="nxd-card" style="margin-top:12px;"><div class="nxd-eyebrow">Recent Activity</div>' + activity() + '</div>';

    document.getElementById('nxdBody').innerHTML = html;

    var bars = document.querySelectorAll('#nxdFlow .nxd-flowbar');
    for (var i = 0; i < bars.length; i++) {
      bars[i].addEventListener('click', function () { drill(this.getAttribute('data-stage')); });
    }
    document.getElementById('nxdUpdated').textContent = 'updated ' + new Date().toLocaleString();
  }

  function flowW(s) {
    var max = 1;
    D.stageFunnel.forEach(function (x) { max = Math.max(max, x.count || 0); });
    return Math.round(((s.count || 0) / max) * 100);
  }

  function board() {
    if (!D.leaderboard.length) return '<div class="nxd-sub">No owners yet.</div>';
    return '<table class="nxd-table">' + D.leaderboard.map(function (r) {
      return '<tr><td><strong>' + esc(r.owner) + '</strong></td><td>' + r.hosts + ' hosts</td>' +
        '<td><span class="nxd-pill live">' + r.live + ' live</span></td></tr>';
    }).join('') + '</table>';
  }

  function momentum() {
    var max = 1;
    D.trend.forEach(function (w) { max = Math.max(max, w.activities || 0); });
    return '<div class="nxd-mbars">' + D.trend.map(function (w) {
      var h = Math.max(3, Math.round(((w.activities || 0) / max) * 100));
      return '<div class="nxd-mbar"><div class="bar" style="height:' + h + '%" title="' + w.activities + ' activities"></div><span>' + esc(w.week) + '</span></div>';
    }).join('') + '</div>';
  }

  function overdue() {
    var items = (D.followUpsDue || []).filter(function (f) { return f.overdue; }).slice(0, 5);
    if (!items.length) return '<div class="nxd-sub">Nothing overdue. Enjoy the quiet.</div>';
    return items.map(function (f) {
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);">' +
        '<span><strong>' + esc(f.hostName) + '</strong><br><span class="nxd-sub">' + esc(f.subject) + '</span></span>' +
        '<span class="nxd-pill bad">late</span></div>';
    }).join('');
  }

  function activity() {
    if (!D.recentActivity.length) return '<div class="nxd-sub">No activity yet.</div>';
    return '<table class="nxd-table">' + D.recentActivity.map(function (a) {
      return '<tr><td style="white-space:nowrap;">' + esc(a.createdAt ? String(a.createdAt).slice(0, 16).replace('T', ' ') : '-') + '</td>' +
        '<td><strong>' + esc(a.hostName) + '</strong></td><td>' + esc(a.subject || a.type) + '</td></tr>';
    }).join('') + '</table>';
  }

  function drill(stageKey) {
    var label = stageKey, list = [];
    D.stageFunnel.forEach(function (s) { if (s.key === stageKey) label = s.label; });
    (D.hostsBasic || []).forEach(function (h) {
      if (h.stage === stageKey) list.push(h);
    });
    document.getElementById('nxdDrillTitle').textContent = label + ' (' + list.length + ')';
    document.getElementById('nxdDrillSub').textContent = 'Click a host, then open it in the Smart Panel.';
    document.getElementById('nxdDrillList').innerHTML = list.length ? list.map(function (h) {
      return '<div style="display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;">' +
        '<span><strong>' + esc(h.hostName) + '</strong><br><span class="nxd-sub">' + esc(h.owner) + ' · ' + esc(h.phone || h.email || 'no contact') + '</span></span>' +
        '<span class="nxd-pill">' + esc(h.lifecycleStatus) + '</span></div>';
    }).join('') : '<div class="nxd-sub">No hosts in this stage.</div>';
    document.getElementById('nxdDrill').classList.add('open');
  }

  document.getElementById('nxdDrillClose').addEventListener('click', function () {
    document.getElementById('nxdDrill').classList.remove('open');
  });
  document.getElementById('nxdDrill').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.getElementById('nxdRefresh').addEventListener('click', function () {
    document.getElementById('nxdBody').innerHTML = '<div class="nxd-card">Loading NEXG Intelligence…</div>';
    if (window.google && google.script && google.script.run) load();
    else document.getElementById('nxdBody').innerHTML = '<div class="nxd-err">Google Apps Script bridge not detected.</div>';
  });

  load();
})();
</script>
</body>
</html>
