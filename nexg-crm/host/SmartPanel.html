<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXG Smart Panel</title>

  <?!= NEXG_include('Theme'); ?>
  <?!= NEXG_include('CSS'); ?>
  <?!= NEXG_include('Motion'); ?>
  <?!= NEXG_include('Components'); ?>
  <?!= NEXG_include('Forms'); ?>
  <?!= NEXG_include('Cards'); ?>

  <style>
    :root{--nx-charcoal-0:#0c0c0e;--nx-charcoal-1:#1c1c1e;--nx-charcoal-2:#2c2c2e;--nx-charcoal-3:#3a3a3c;--nx-charcoal-text:#f5f5f7;--nx-gold:#d4af37}
    [hidden]{display:none!important}
    body{background:var(--nx-charcoal-0);overflow:hidden;margin:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{width:0!important;height:0!important}

    .nx-shell{display:flex;flex-direction:column;height:100vh}

    /* Top bar with progressive blur */
    .nx-panel-topbar{position:sticky;top:0;z-index:30;display:grid;gap:8px;padding:10px 12px;isolation:isolate;border-bottom:1px solid rgba(255,255,255,.08)}
    .nx-panel-topbar::before,.nx-panel-topbar::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
    .nx-panel-topbar::before{background:rgba(28,28,30,.45);-webkit-backdrop-filter:blur(6px) saturate(160%);backdrop-filter:blur(6px) saturate(160%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.7) 60%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.7) 60%,transparent 100%)}
    .nx-panel-topbar::after{background:rgba(28,28,30,.7);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.85) 55%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.85) 55%,#000 100%)}
    .nx-panel-brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--nx-charcoal-text)}
    .nx-panel-brand .material-symbols-outlined{color:var(--nx-gold)}
    /* Logo: flat light artwork straight on the dark header, orange accents kept */
    .nx-brand-badge{display:inline-flex;align-items:center;line-height:0}
    .nx-brand-badge svg{display:block;height:26px;width:auto}

    .nx-button--primary{background:linear-gradient(180deg,var(--nx-charcoal-2),var(--nx-charcoal-1));border:1px solid var(--nx-charcoal-3);color:var(--nx-charcoal-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
    .nx-button--primary:hover{background:var(--nx-charcoal-3)}
    .nx-button.is-success{background:var(--nx-color-success)!important;border-color:var(--nx-color-success)!important;color:#04150a!important}
    .nx-input,.nx-select,.nx-textarea{background:var(--nx-charcoal-1);border-color:var(--nx-charcoal-3);color:var(--nx-charcoal-text)}

    /* Hero search */
    .nx-search-wrap{position:relative}
    .nx-search-wrap .nx-input{min-height:46px;font-size:15px;padding-left:38px}
    .nx-search-wrap .nx-search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--nx-color-text-muted);pointer-events:none}
    .nx-search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--nx-charcoal-1);border:1px solid var(--nx-charcoal-3);border-radius:12px;box-shadow:var(--nx-shadow-3);max-height:340px;overflow-y:auto}
    .nx-search-group{padding:8px 12px 4px;font-size:11px;color:var(--nx-color-text-muted);text-transform:uppercase;letter-spacing:.04em}
    .nx-search-item{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:42px;padding:8px 12px;border:none;background:none;color:var(--nx-charcoal-text);text-align:left;cursor:pointer}
    .nx-search-item:hover,.nx-search-item.is-active{background:rgba(255,255,255,.06)}

    /* Tabs (3 max) — heavy frosted band so content melts into blur beneath */
    .nx-tabbar{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(12,12,14,.78);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 14px 28px -18px rgba(0,0,0,.9)}
    .nx-tabbar button{flex:1;min-height:42px;border:none;background:none;color:var(--nx-color-text-secondary);font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
    .nx-tabbar button.is-active{color:var(--nx-charcoal-text);border-bottom-color:var(--nx-gold)}
    .nx-panel-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 80px;display:block}
    .nx-panel-content>*+*{margin-top:12px}

    /* Pinned relationship header (sticky under topbar) — true frosted glass:
       translucent so scrolled content blurs through beneath it. */
    .nx-pinned{position:sticky;top:0;z-index:20;background:rgba(12,12,14,.6);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--nx-charcoal-2);border-bottom-color:rgba(255,255,255,.1);border-radius:14px;padding:12px;margin:-12px -12px 0}
    .nx-pinned__name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
    .nx-pinned__stars{color:var(--nx-gold);letter-spacing:1px;font-size:13px}
    .nx-pinned__meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--nx-color-text-secondary)}
    .nx-pinned__meta b{color:var(--nx-charcoal-text);font-weight:600}
    .nx-pinned__back{font-size:12px;color:var(--nx-color-text-muted);background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px}

    /* Cards: expand/collapse + enter */
    .nx-card2{background:var(--nx-charcoal-1);border:1px solid var(--nx-charcoal-2);border-radius:14px;overflow:hidden}
        .nx-card2__head{display:flex;align-items:center;gap:8px;width:100%;padding:12px;background:none;border:none;color:inherit;cursor:pointer;text-align:left}
    .nx-card2__title{font-size:13px;font-weight:700}
    .nx-card2__summary{font-size:11px;color:var(--nx-color-text-muted)}
    .nx-card2__spacer{flex:1}
    .nx-card2__iconbtn,.nx-card2__chevron{color:var(--nx-color-text-secondary);display:inline-flex}
    .nx-card2__iconbtn:hover{color:var(--nx-charcoal-text)}
        .nx-card2__collapse{overflow:hidden;max-height:2000px;transition:max-height 240ms cubic-bezier(.2,.8,.2,1)}
    .nx-card2.is-collapsed .nx-card2__collapse{max-height:0}
    .nx-card2__body{padding:4px 12px 12px;display:block}
    .nx-card2__body>*+*{margin-top:10px}
    .nx-action-grid,.nx-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .nx-action-card{min-height:64px}
    .nx-card2__footer{padding:0 12px 12px;display:flex;gap:8px}
    .nx-field.is-hidden{display:none}

    /* Inner grids render fully inside an expanded card */
    .nx-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .nx-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(max-width:480px){.nx-action-grid,.nx-today-grid{grid-template-columns:1fr}}

    /* Today metric chips */
    .nx-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .nx-today-chip{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--nx-charcoal-2);border-radius:12px;background:var(--nx-charcoal-0);cursor:pointer}
    .nx-today-chip .v{font-size:20px;font-weight:700}
    .nx-today-chip .k{font-size:11px;color:var(--nx-color-text-muted)}

    /* Action rows: plain list, not boxes. Hairline separators, no containers. */
    .nx-action-grid{display:grid;grid-template-columns:1fr;gap:0}
    .nx-action-card{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:52px;padding:10px 4px;border:none;border-bottom:1px solid rgba(255,255,255,.07);border-radius:0;background:transparent;color:var(--nx-charcoal-text);cursor:pointer;text-align:left;width:100%}
    .nx-action-card:last-child{border-bottom:none}
    .nx-action-card:hover{background:rgba(255,255,255,.04)}
    .nx-action-card .material-symbols-outlined{color:var(--nx-gold);background:rgba(212,175,55,.12);border-radius:9px;padding:7px;font-size:18px;flex:none}
    .nx-action-card span.lbl{font-size:13px;font-weight:600;flex:1}
    .nx-action-card::after{content:'chevron_right';font-family:'Material Symbols Outlined';font-size:20px;color:var(--nx-color-text-muted);flex:none}

    /* Journey heart */
    .nx-journey2{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:4px 0}
    .nx-journey2__step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;background:none;border:none;cursor:pointer;color:inherit}
    .nx-journey2__dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--nx-charcoal-2);border:1px solid var(--nx-charcoal-3);color:var(--nx-color-text-muted)}
    .nx-journey2__dot .material-symbols-outlined{font-size:16px}
    .nx-journey2__step.is-completed .nx-journey2__dot{background:var(--nx-color-success-soft);color:var(--nx-color-success);border-color:rgba(34,197,94,.35)}
    .nx-journey2__step.is-current .nx-journey2__dot{background:var(--nx-color-primary-soft);color:var(--nx-color-primary);border-color:rgba(62,123,250,.45);box-shadow:0 0 0 3px rgba(62,123,250,.15)}
    .nx-journey2__label{font-size:10px;color:var(--nx-color-text-muted);white-space:nowrap}
    .nx-journey2__step.is-current .nx-journey2__label{color:var(--nx-charcoal-text);font-weight:600}
    .nx-journey2__line{flex:1;min-width:10px;height:2px;background:var(--nx-charcoal-3)}
    .nx-journey2__line.is-complete{background:var(--nx-color-success)}
    .nx-stage-frame{border:1px solid var(--nx-charcoal-2);border-radius:12px;padding:12px;margin-top:8px}
    .nx-stage-frame__title{font-size:12px;font-weight:700;color:var(--nx-gold);margin-bottom:8px}

    .nx-checklist{display:grid;gap:6px}
    .nx-checklist__item{display:flex;gap:8px;align-items:center;font-size:12px}
    .nx-checklist__item .material-symbols-outlined{font-size:16px}
    .nx-checklist__item.is-done{color:var(--nx-color-success)}
    .nx-checklist__item.is-pending{color:var(--nx-color-text-muted)}

    /* Host list cards */
    .nx-host-item{width:100%;text-align:left;display:grid;gap:6px;padding:12px;background:var(--nx-charcoal-0);border:1px solid var(--nx-charcoal-2);border-radius:12px;cursor:pointer}
    .nx-host-item:hover{border-color:var(--nx-charcoal-3)}
    .nx-host-item__title{display:block;font-weight:600}
    .nx-host-item__meta{display:flex;flex-wrap:wrap;gap:4px}
    .nx-host-item__contact{display:block;color:var(--nx-color-text-muted);font-size:12px}

    .nx-queue-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--nx-charcoal-2);border-radius:12px;background:var(--nx-charcoal-0)}
    .nx-queue-item.is-overdue{border-color:rgba(239,68,68,.4)}

    .nx-list{display:grid;gap:8px}
    .nx-list__row{display:flex;justify-content:space-between;gap:16px}
    .nx-list__label{color:var(--nx-color-text-muted);font-size:12px}

    .nx-bar-row{display:grid;grid-template-columns:84px 1fr 26px;gap:8px;align-items:center}
    .nx-bar{height:10px;border-radius:6px;background:var(--nx-charcoal-2);overflow:hidden}
    .nx-bar>div{height:100%;background:linear-gradient(90deg,var(--nx-gold),#f0d070);border-radius:6px;transition:width 300ms cubic-bezier(0,0,.2,1)}

    .nx-timeline{display:grid;gap:12px}
    .nx-timeline__item{display:grid;grid-template-columns:34px 1fr;gap:10px;position:relative}
    .nx-timeline__item:first-child{animation:nx-slide-in-right 300ms cubic-bezier(0,0,.2,1)}
    .nx-timeline__icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--nx-charcoal-2);border:1px solid var(--nx-charcoal-3);color:var(--nx-color-text-secondary)}
    .nx-timeline__icon .material-symbols-outlined{font-size:16px}
    .nx-timeline__title{font-weight:600;font-size:13px}
    .nx-timeline__meta{color:var(--nx-color-text-muted);font-size:11px;margin-top:2px}

    .nx-empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:24px}
    .nx-empty__icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--nx-charcoal-2)}
    .nx-empty__title{font-weight:600}
    .nx-empty__message{color:var(--nx-color-text-secondary);font-size:12px;max-width:280px}

    .nx-alert{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--nx-color-border);background:var(--nx-color-surface-2)}
    .nx-alert--danger{border-color:rgba(239,68,68,.35);background:var(--nx-color-danger-soft)}
    .nx-alert__title{font-weight:600}
    .nx-alert__message{color:var(--nx-color-text-secondary);margin-top:2px;font-size:12px}

    .nx-section-block{border:1px solid var(--nx-charcoal-2);border-radius:12px;padding:10px}
    .nx-section-block__title{font-size:12px;font-weight:700;color:var(--nx-gold);margin-bottom:8px}

    .nx-skeleton{position:relative;overflow:hidden;background:var(--nx-charcoal-2);border-radius:8px}
    .nx-skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:nx-shimmer 1.2s infinite}
    .nx-skeleton--card{height:84px}
    .nx-skeleton--text{height:14px}

    .nx-chip{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:3px 9px;border-radius:999px;border:1px solid var(--nx-color-border);background:var(--nx-charcoal-2);color:var(--nx-color-text-secondary);font-size:11px;font-weight:500}
    .nx-chip--success{background:var(--nx-color-success-soft);color:var(--nx-color-success);border-color:rgba(34,197,94,.35)}
    .nx-chip--warning{background:var(--nx-color-warning-soft);color:var(--nx-color-warning);border-color:rgba(245,158,11,.35)}
    .nx-chip--info{background:var(--nx-color-info-soft);color:var(--nx-color-info);border-color:rgba(56,189,248,.35)}
    .nx-chip--primary{background:var(--nx-color-primary-soft);color:var(--nx-color-primary);border-color:rgba(62,123,250,.35)}

    .nx-field{display:grid;gap:6px;margin-bottom:14px}
    .nx-field__label{font-size:12px;font-weight:600;color:var(--nx-color-text-secondary)}
    .nx-field__required{color:var(--nx-color-danger)}
    .nx-field__error{display:none;color:var(--nx-color-danger);font-size:12px}
    .nx-field.is-invalid .nx-input,.nx-field.is-invalid .nx-select,.nx-field.is-invalid .nx-textarea{border-color:var(--nx-color-danger)}
    .nx-field.is-invalid .nx-field__error{display:block}
    .nx-check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:13px;font-weight:600}
    .nx-check input{width:20px;height:20px;accent-color:var(--nx-gold);flex:none}

    .nx-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border:1px solid transparent;border-radius:10px;font-weight:600;cursor:pointer;background:transparent;color:var(--nx-charcoal-text);transition:background .12s,border-color .12s}
    .nx-button--secondary{background:var(--nx-charcoal-2);border-color:var(--nx-charcoal-3)}
    .nx-button--secondary:hover{background:var(--nx-charcoal-3)}
    .nx-button--ghost{color:var(--nx-color-text-secondary)}
    .nx-button--ghost:hover{background:rgba(255,255,255,.05)}
    .nx-button--danger{background:var(--nx-color-danger);color:#fff}
    .nx-button--icon{width:44px;height:44px;padding:0}
    .nx-button:disabled{opacity:.5;cursor:not-allowed}
    .nx-button.is-loading{color:transparent!important;pointer-events:none}
    .nx-button.is-loading::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);border-top-color:transparent;animation:nx-spin .7s linear infinite}

    /* Full-screen enter modal */
    .nx-overlay{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity 250ms cubic-bezier(0,0,.2,1),visibility 250ms}
    .nx-overlay.is-open{opacity:1;visibility:visible}
    .nx-overlay__container{height:100%;display:flex;align-items:stretch;padding:0}
    .nx-modal{width:100%;height:100%;max-height:100%;display:flex;flex-direction:column;background:var(--nx-charcoal-0);transform:translateY(16px);opacity:0;transition:transform 250ms cubic-bezier(0,0,.2,1),opacity 250ms}
    .nx-overlay.is-open .nx-modal{transform:none;opacity:1}
    .nx-modal__header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-bottom:1px solid rgba(255,255,255,.08)}
    .nx-modal__header>div:first-child{flex:1;min-width:0}
    .nx-modal__title{margin:0;font-size:17px;font-weight:700}
    .nx-modal__subtitle{margin-top:2px;color:var(--nx-color-text-secondary);font-size:12px}
    .nx-modal__body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:grid;gap:14px;align-content:start}
    .nx-modal__footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);background:rgba(28,28,30,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

    .nx-toast-region{position:fixed;right:12px;bottom:12px;display:grid;gap:8px;width:min(340px,calc(100vw - 24px));z-index:1400}
    .nx-toast{display:flex;gap:10px;padding:12px;background:var(--nx-charcoal-1);border:1px solid var(--nx-charcoal-3);border-radius:12px;box-shadow:var(--nx-shadow-2);opacity:0;transform:translateY(10px);transition:opacity 150ms,transform 150ms}
    .nx-toast.is-visible{opacity:1;transform:none}
    .nx-toast__title{font-weight:600;font-size:13px}
    .nx-toast__message{color:var(--nx-color-text-secondary);font-size:12px;margin-top:2px}
    .nx-toast--success .nx-toast__icon{color:var(--nx-color-success)}
    .nx-toast--error .nx-toast__icon{color:var(--nx-color-danger)}
    .nx-toast--info .nx-toast__icon{color:var(--nx-color-info)}

    .nx-offline-banner{display:none;background:var(--nx-color-warning-soft);border-bottom:1px solid rgba(245,158,11,.4);color:var(--nx-color-warning);padding:6px 12px;font-size:12px;font-weight:600}
    .nx-offline-banner.is-visible{display:block}

    .nx-flex{display:flex;align-items:center}.nx-flex--between{justify-content:space-between}.nx-flex--wrap{flex-wrap:wrap}
    .nx-gap-1{gap:4px}.nx-gap-2{gap:8px}
    .nx-mt-1{margin-top:4px}.nx-mt-2{margin-top:8px}
    .nx-text-muted{color:var(--nx-color-text-muted)}.nx-text-small{font-size:12px}
    .nx-col-6{grid-column:span 6}.nx-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
    .nx-card{background:var(--nx-charcoal-1);border:1px solid var(--nx-charcoal-2);border-radius:14px}
    .nx-card__body{padding:14px;display:grid;gap:6px}
    .nx-card--metric .nx-card__value{font-size:24px;font-weight:700}
    .nx-divider{height:1px;background:rgba(255,255,255,.08);border:none;margin:8px 0}

    @keyframes nx-spin{to{transform:rotate(360deg)}}
    @keyframes nx-shimmer{100%{transform:translateX(100%)}}
    @keyframes nx-slide-in-right{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
    @media(max-width:480px){.nx-action-grid,.nx-today-grid{grid-template-columns:1fr}}

    /* Keyboard focus: reuse the theme focus ring everywhere actionable */
    .nx-button:focus-visible,.nx-input:focus-visible,.nx-select:focus-visible,.nx-textarea:focus-visible,
    .nx-tabbar button:focus-visible,.nx-search-item:focus-visible,.nx-host-item:focus-visible,
    .nx-card2__head:focus-visible,.nx-today-chip:focus-visible{outline:none;box-shadow:var(--nx-shadow-focus)}

    /* Stepped-form progress */
    .nx-stepdots__label{font-size:11px;color:var(--nx-color-text-muted);margin-bottom:6px}
    .nx-stepdots{display:flex;gap:6px;margin-bottom:12px}
    .nx-stepdots__dot{height:6px;flex:1;border-radius:999px;background:var(--nx-charcoal-3)}
    .nx-stepdots__dot.is-done{background:var(--nx-color-success)}
    .nx-stepdots__dot.is-current{background:var(--nx-gold)}

    /* Reduced motion: honor the OS setting, kill shimmer/slide/transitions */
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }

    /* Density: metric chips are number+label only — keep 2 columns even in the
       narrow sidebar (later rule wins over the 480px collapse above), compact. */
    .nx-today-grid{grid-template-columns:1fr 1fr}
    .nx-today-chip{gap:0;padding:9px 10px}
    .nx-today-chip .v{font-size:18px}
    /* Host lists stack full-width: two squeezed columns help nobody. */
    .nx-grid.nx-stack{grid-template-columns:1fr}
    .nx-grid.nx-stack>.nx-col-6{grid-column:span 12}
  </style>
</head>

<body>
  <div class="nx-shell">
