function isGAS() {

}

function escapeHtml_(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const el = document.getElementById('toast-notification');
  const msgEl = document.getElementById('toast-message');
  if (!el || !msgEl) return;
  msgEl.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function combineDateTime(dateId, timeId) {
  const d = document.getElementById(dateId);
  const t = document.getElementById(timeId);
  const dv = d ? d.value : '';
  const tv = t ? t.value : '';
  if (!dv && !tv) return '';
  return (dv || getFormattedDateToday()) + ' ' + (tv || '10:00');
}

/* ═══ DATE / TIME HELPERS ═══════════════════════════════════════ */

function getFormattedNow() {
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + " " +
    d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

function getFormattedDateToday() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,'0') + "-" +
    d.getDate().toString().padStart(2,'0');
}

function getFormattedDateTomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,'0') + "-" +
    d.getDate().toString().padStart(2,'0');
}

function getFormattedTimeNow() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

/* ═══ MODALS ════════════════════════════════════════════════════ */

function openModal(id) {

function closeModal(id) {

  const containers = overlay ? overlay.querySelectorAll('.modal-dp-list-container') : [];

  }
  else if (id === 'onboarding-modal') {

  }
  else if (id === 'live-modal') {
    const ld = document.getElementById('live-date-input'); if (ld) ld.value = today;

/* ═══ DISCUSSION POINTS ENGINE (v2 — segmented sentiment) ═══════ */

const modalSentiments = { contact: 'Positive', fu: 'Positive', mtg: 'Positive' };

function setModalSentiment(prefix, value) {
  modalSentiments[prefix] = value;
  const row = document.getElementById(prefix + '-dp-sentiment');
  if (row) row.querySelectorAll('.dp-sent-opt').forEach(b =>
    b.classList.toggle('active', b.dataset.v === value));
}

function addModalPoint(prefix) {
  const input = document.getElementById(prefix + '-dp-input');
  if (!input) return;
  if (!input.value.trim()) {
    input.classList.remove('nx-shake'); void input.offsetWidth;
    input.classList.add('nx-shake'); input.focus();
    return;
  }
  modalDiscussionPoints.push({ text: input.value.trim(), sentiment: modalSentiments[prefix] || 'Positive' });
  input.value = '';
  input.focus();
  renderModalPoints(document.getElementById(prefix + '-dp-list'));
  document.querySelectorAll('.dp-count').forEach(c => c.innerText = modalDiscussionPoints.length);
  const newest = document.querySelector('#' + prefix + '-dp-list .dp-chip:last-of-type');
  if (newest) newest.classList.add('dp-new');
}

function renderModalPoints(container) {
  if (!container) return;
  if (!modalDiscussionPoints.length) {
    container.innerHTML = '<div class="dp-empty">No points yet — capture what the merchant said</div>';
    return;
  }
  const rail  = { Positive:'dp-pos', Neutral:'dp-neu', Negative:'dp-neg' };
  const cls   = { Positive:'pos',    Neutral:'neu',    Negative:'neg' };
  const glyph = { Positive:'+ Pos',  Neutral:'Neu',    Negative:'− Neg' };
  container.innerHTML = modalDiscussionPoints.map((p, i) => `
    <div class="dp-chip ${rail[p.sentiment] || 'dp-neu'}">
      <span class="dp-text">${escapeHtml_(p.text)}</span>
      <span class="dp-sent ${cls[p.sentiment] || 'neu'}">${glyph[p.sentiment] || p.sentiment}</span>
      <button type="button" class="dp-del" onclick="removeModalPoint(${i}, this)" title="Remove point">✕</button>
    </div>
  `).join('');
}

function removeModalPoint(idx, el) {
  const chip = el && el.closest ? el.closest('.dp-chip') : null;
  if (chip) chip.classList.add('dp-out');
  setTimeout(() => {
    modalDiscussionPoints.splice(idx, 1);
    document.querySelectorAll('.modal-dp-list-container').forEach(c => renderModalPoints(c));
    document.querySelectorAll('.dp-count').forEach(c => c.innerText = modalDiscussionPoints.length);
  }, 150);
}

function getModalPointsList() {
  return (modalDiscussionPoints || []).map(p => ({
    sentiment: p.sentiment,
    point: p.text,
    text: p.text
  }));
}

    renderSearchResults(allMerchants);
  }
}

function collapseMerchantSearch() {
  document.getElementById('mch-selector-collapsed').classList.remove('hidden');
  document.getElementById('mch-selector-expanded').classList.add('hidden');
}

function renderSearchResults(list) {
  const container = document.getElementById('mch-search-results');
  if (!container) return;
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="p-4 text-center text-[10.5px] text-muted/40 italic">No merchants found</div>';
    return;
  }
  let html = '';
  list.forEach(m => {
    const branchLabel = m.branchType === 'Multi Branch' ? `Multi (${m.branches || 1})` : 'Single';
    html += `
      <div class="p-2.5 rounded-xl cursor-pointer flex items-center justify-between gap-2 bg-white/[0.02] border border-white/[0.04] hover:border-gold/20 transition-all"
           onclick="selectMerchantById('${m.id}')">
        <div class="flex flex-col min-w-0">
          <span class="text-[11.5px] font-black text-white truncate">${m.name || m.businessName}</span>
          <div class="flex items-center gap-1.5 text-[8.5px] text-muted/50 font-mono mt-0.5">
            <span class="text-muted/30">${m.id}</span>
            <span class="text-muted/15">•</span>
            <span class="text-gold/80 font-black">${branchLabel}</span>
          </div>
        </div>
        <div class="flex flex-col items-end shrink-0 gap-1">
          <span class="text-[7.5px] px-2 py-0.5 bg-gold/10 text-gold border border-gold/20 rounded-md font-black uppercase">
            ${m.pipeline || m.status || 'Lead'}
          </span>
          <span class="text-[7.5px] text-muted/40">${m.mainCategory || m.vertical || 'Delivery'}</span>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function filterMerchantSearchResults() {
  const query = (document.getElementById('mch-search-input').value || '').toLowerCase();
  if (!query) { renderSearchResults(allMerchants); return; }
  const filtered = allMerchants.filter(m =>
    String(m.name || m.businessName || '').toLowerCase().includes(query) ||
    String(m.id || '').toLowerCase().includes(query) ||
    String(m.mainCategory || m.vertical || '').toLowerCase().includes(query) ||
    String(m.subCategory || '').toLowerCase().includes(query) ||
    String(m.phone || '').toLowerCase().includes(query) ||
    String(m.salesRep || '').toLowerCase().includes(query)
  );
  renderSearchResults(filtered);
}

function selectMerchantById(merchantId) {
  showToast("Loading...");
  collapseMerchantSearch();
  if (isGAS()) {
    google.script.run
      .withSuccessHandler(function(profile) {
        if (profile) { applyProfile(profile); updateUI(); showToast("Loaded: " + currentMerchant.name); }
        else { showToast("Merchant not found"); }
      })
      .withFailureHandler(function(err) { showToast("Error: " + err); })
      .getMerchantProfileForPanel(merchantId);
  } else {
    const found = allMerchants.find(m => String(m.id) === String(merchantId));
    if (found) Object.assign(currentMerchant, found);
    updateUI();
    showToast("Loaded: " + currentMerchant.name);
  }
}

/* ═══ PROFILE ═══════════════════════════════════════════════════ */

function applyProfile(profile) {
  const m = profile.merchant || profile;
  if (m) {
    currentMerchant.id = m.id || currentMerchant.id;
    currentMerchant.name = m.businessName || m.name || currentMerchant.name;
    currentMerchant.mainCategory = m.mainCategory || m.vertical || currentMerchant.mainCategory;
    currentMerchant.subCategory = m.subCategory || currentMerchant.subCategory;
    currentMerchant.contactPerson = m.contactPerson || '';
    currentMerchant.position = m.position || '';
    currentMerchant.phone = m.phone || '';
    currentMerchant.altPhone = m.altPhone || '';
    currentMerchant.whatsapp = m.whatsapp || '';
    currentMerchant.email = m.email || '';
    currentMerchant.website = m.website || '';
    currentMerchant.address = m.address || m.region || '';
    currentMerchant.branchType = m.branchType || 'Single';
    currentMerchant.branches = m.branches || 1;
    currentMerchant.salesRep = m.salesRep || '';
    currentMerchant.leadSource = m.leadSource || m.source || '';
    currentMerchant.priority = m.priority || 'Medium';
    currentMerchant.pipeline = m.pipeline || m.status || 'Lead';
    currentMerchant.decisionMaker = m.decisionMaker || '';
    currentMerchant.decision = m.decision || '';
    currentMerchant.nextFollowUp = m.nextFollowUp || m.nextAction || '';
    currentMerchant.notes = m.notes || '';
    currentMerchant.row = m.row || 2;
    currentMerchant.createdAt = m.createdAt || '';
    currentMerchant.updatedAt = m.updatedAt || '';
  }
  currentMerchant.activities = profile.activities || [];
  currentMerchant.meetings = profile.meetings || [];
  currentMerchant.followUps = profile.followUps || [];
  currentMerchant.discussionPoints = profile.feedback || profile.discussionPoints || [];
}

function updateSubCategories(mainId, subId, scopeId) {
  const mainSelect = document.getElementById(mainId);
  const subSelect = document.getElementById(subId);
  const scopeEl = document.getElementById(scopeId);
  if (!mainSelect || !subSelect) return;
  const category = mainSelect.value;
  const subs = SUBCATEGORIES[category] || [];
  subSelect.innerHTML = '';
  subs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.text = s;
    subSelect.appendChild(opt);
  });
  if (scopeEl) scopeEl.innerText = CATEGORY_DESCRIPTIONS[category] || 'N/A';
}

function getMainCategoryBySub(subCategory) {
  for (const [cat, subs] of Object.entries(SUBCATEGORIES)) {
    if (subs.includes(subCategory)) return cat;
  }
  return 'Delivery';
}

/* ═══ RECOMMENDED ACTION ════════════════════════════════════════ */

function getRecommendedAction(m) {
  const stage = String(m.pipeline || 'Lead').toLowerCase();
  const todayStr = getFormattedDateToday();
  if (stage.includes('lead')) return { title: 'Initial Contact Outreach', reason: 'Call or WhatsApp to identify decision maker and introduce NEXG', date: todayStr, time: 'Now' };
  if (stage.includes('contact')) return { title: 'Schedule Follow Up', reason: 'Follow up to gauge interest level', date: todayStr, time: 'Today' };
  if (stage.includes('follow')) return { title: 'Book a Meeting', reason: 'Convert follow-up into a meeting', date: todayStr, time: 'This Week' };
  if (stage.includes('meeting')) return { title: 'Prepare Demo', reason: 'Schedule and prepare a product demonstration', date: todayStr, time: 'This Week' };
  if (stage.includes('demo')) return { title: 'Send Proposal', reason: 'Send commercial proposal based on demo feedback', date: todayStr, time: '48h' };
  if (stage.includes('proposal')) return { title: 'Begin Negotiation', reason: 'Discuss pricing and terms', date: todayStr, time: 'This Week' };
  if (stage.includes('negot')) return { title: 'Issue Contract', reason: 'Prepare and send contract for signature', date: todayStr, time: 'ASAP' };
  if (stage.includes('contract')) return { title: 'Start Onboarding', reason: 'Begin onboarding and system config', date: todayStr, time: 'Now' };
  if (stage.includes('onboard')) return { title: 'Go Live!', reason: 'Complete checklist and activate merchant', date: todayStr, time: 'Target' };
  if (stage.includes('live') || stage.includes('won')) return { title: 'Account Management', reason: 'Monitor performance and satisfaction', date: todayStr, time: 'Ongoing' };
  if (stage.includes('lost')) return { title: 'Re-evaluate Lead', reason: 'Consider re-engagement or close file', date: todayStr, time: 'When Ready' };
  return { title: 'Take Action', reason: 'Review status and determine next step', date: todayStr, time: 'Now' };
}

function executeRecommendedAction() {
  const stage = String(currentMerchant.pipeline || 'Lead').toLowerCase();
  if (stage.includes('lead')) openModal('contact-modal');
  else if (stage.includes('contact')) openModal('follow-up-modal');
  else if (stage.includes('follow')) openModal('meeting-modal');
  else if (stage.includes('meeting')) openModal('demo-modal');
  else if (stage.includes('demo')) openModal('proposal-modal');
  else if (stage.includes('proposal')) openModal('negotiation-modal');
  else if (stage.includes('negot')) openModal('contract-modal');
  else if (stage.includes('contract')) openModal('onboarding-modal');
  else if (stage.includes('onboard')) openModal('live-modal');
  else openModal('contact-modal');
}

function mapStageToIndex(stage) {
  if (!stage) return 0;
  const s = String(stage).toLowerCase();
  if (s.includes('lead')) return 0;
  if (s.includes('contact')) return 1;
  if (s.includes('follow')) return 2;
  if (s.includes('meeting')) return 3;
  if (s.includes('demo')) return 4;
  if (s.includes('proposal')) return 5;
  if (s.includes('negot')) return 6;
  if (s.includes('contract')) return 7;
  if (s.includes('onboard')) return 8;
  if (s.includes('live') || s.includes('won') || s.includes('active')) return 9;
  if (s.includes('lost')) return -1;
  return 0;
}

function renderMiniPipeline() {
  const container = document.getElementById('mini-pipeline-track');
  const labelEl = document.getElementById('pipe-current-label');
  if (!container) return;
  const currentIndex = mapStageToIndex(currentMerchant.pipeline);
  const lastIndex = PIPELINE_STAGES.length - 1;
  if (labelEl) {
    labelEl.innerText = currentIndex >= 0 ? (PIPELINE_STAGES[currentIndex]?.label || 'Lead') : 'Lost';
  }
  let html = '';
  PIPELINE_STAGES.forEach((stage, idx) => {
    const isCurrent = idx === currentIndex;
    const isPassed = idx < currentIndex;
    let dotClass = 'pipe-dot';
    if (isCurrent) dotClass += ' current';
    else if (isPassed) dotClass += ' done';
    const showLabel = idx === 0 || isCurrent || idx === lastIndex;
    const labelColor = isCurrent ? 'color:#d4af37;' : '';
    html += `
      <div class="pipe-step" title="${stage.key}: ${stage.desc}">
        <div class="${dotClass}"></div>
        <span class="pipe-label" style="${labelColor} ${showLabel ? '' : 'opacity:0;'}">${stage.label}</span>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderTimelinePipeline() {
  const container = document.getElementById('timeline-pipeline-track');
  if (!container) return;
  const currentIndex = mapStageToIndex(currentMerchant.pipeline);
  const lastIndex = PIPELINE_STAGES.length - 1;
  let html = '<div class="flex flex-col">';
  PIPELINE_STAGES.forEach((stage, idx) => {
    const isCurrent = idx === currentIndex;
    const isPassed = idx < currentIndex;
    let dotClass = 'pipe-dot';
    if (isCurrent) dotClass += ' current';
    else if (isPassed) dotClass += ' done';
    const labelClass = isCurrent ? 'text-gold' : isPassed ? 'text-offwhite' : 'text-faint';
    const badge = isCurrent ? '<span class="tag tag-gold shrink-0">Current</span>'
      : isPassed ? '<span class="tag tag-white shrink-0">Done</span>' : '';
    html += `
      <div class="flex gap-3">
        <div class="flex flex-col items-center">
          <div class="${dotClass} mt-0.5"></div>
          ${idx < lastIndex ? '<div class="w-px flex-1 bg-white/[0.08] my-1"></div>' : ''}

}

function renderStageTimestamps() {
  const setTs = (id, value) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (value && value !== '—') { el.innerText = value; el.classList.add('has-date'); }
    else { el.innerText = '—'; el.classList.remove('has-date'); }
  };
  setTs('ts-created', currentMerchant.createdAt || '—');
  setTs('ts-updated', currentMerchant.updatedAt || '—');
  let contacted = '—', followedUp = '—', met = '—', demoed = '—';
  (currentMerchant.activities || []).forEach(a => {
    const action = String(a.action || a.type || '').toLowerCase();
    const ts = a.timestamp || (a.date + ' ' + (a.time || ''));
    if (action.includes('contact') && contacted === '—') contacted = ts;
    if (action.includes('follow') && followedUp === '—') followedUp = ts;
    if (action.includes('demo') && demoed === '—') demoed = ts;
  });
  (currentMerchant.meetings || []).forEach(m => {
    if (met === '—') met = m.date + ' ' + (m.time || '');
  });
  setTs('ts-contacted', contacted);
  setTs('ts-followup', followedUp);
  setTs('ts-meeting', met);
  setTs('ts-demo', demoed);
}

function renderFeedbackPoints() {

  const rawContainer = document.getElementById('feedback-raw-stream-container');
  setTxt('feedback-count-badge', points.length + " Points");
  const positivePoints = points.filter(p => p.sentiment === 'Positive' || p.type === 'Positive');
  const negativePoints = points.filter(p => p.sentiment === 'Negative' || p.type === 'Negative');
  setTxt('compiled-positive-count', positivePoints.length);
  setTxt('compiled-negative-count', negativePoints.length);
  if (positivePoints.length === 0) {
    posList.innerHTML = '<span class="text-[9.5px] text-muted/25 italic">No positive points</span>';
  } else {
    posList.innerHTML = positivePoints.map(p =>
      '<div class="text-[10.5px] text-offwhite/85 flex items-start gap-1.5 leading-snug"><span class="text-gold mt-1 text-[6px]">●</span><span>' + (p.text || p.point || '') + '</span></div>'
    ).join('');
  }
  if (negativePoints.length === 0) {
    negList.innerHTML = '<span class="text-[9.5px] text-muted/25 italic">No objections</span>';
  } else {
    negList.innerHTML = negativePoints.map(p =>
      '<div class="text-[10.5px] text-offwhite/85 flex items-start gap-1.5 leading-snug"><span class="text-muted mt-1 text-[6px]">●</span><span>' + (p.text || p.point || '') + '</span></div>'
    ).join('');
  }
  if (points.length === 0) {
    rawContainer.innerHTML = '<div class="p-4 text-center text-[10.5px] text-muted/25 italic">No feedback recorded</div>';
    return;
  }
  let r_html = "";
  points.forEach((p, idx) => {
    const sent = p.sentiment || p.type || 'Neutral';
    let badgeStyle = "bg-white/[0.04] text-offwhite border-white/[0.08]";
    let railClass = "dp-rail-neu";
    if (sent === 'Positive') { badgeStyle = "bg-gold/10 text-gold border-gold/20"; railClass = "dp-rail-pos"; }
    if (sent === 'Negative') { badgeStyle = "bg-danger/10 text-danger border-danger/20"; railClass = "dp-rail-neg"; }

function submitDirectFeedback() {
  const input = document.getElementById('feedback-text-input');
  const text = input.value.trim();
  if (!text) { showToast("Enter feedback first."); return; }
  const newPoint = {
    id: 'DP-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
    sentiment: selectedFeedbackSentiment, stage: currentMerchant.pipeline,
    timestamp: getFormattedNow(), text: text, type: selectedFeedbackSentiment
  };
  currentMerchant.discussionPoints.unshift(newPoint);
  input.value = "";
  updateUI();
  showToast("Feedback logged! ID: " + newPoint.id);
  const newestRaw = document.querySelector('#feedback-raw-stream-container > div');
  if (newestRaw) newestRaw.classList.add('dp-new');
  input.focus();
  if (isGAS()) {
    google.script.run
      .withFailureHandler(function(e){ showToast('Feedback save failed: ' + (e && e.message ? e.message : e)); })
      .addFeedbackFromPanel({ merchantId: currentMerchant.id, feedbackType: selectedFeedbackSentiment, point: text });
  }
}

function submitContactLog() {
  function rd(id){ var e = document.getElementById(id); return e ? e.value : ''; }
  var payload, actId;
  try {
    var method   = rd('contact-method-select');
    var person   = rd('contact-person-input') || '';
    var outcome  = rd('contact-outcome-select');
    var notes    = rd('contact-notes-input') || '';
    var createFU = rd('contact-create-follow-up') === 'YES';
    var fuDate   = combineDateTime('contact-follow-up-date', 'contact-follow-up-time');
    var fuReason = rd('contact-follow-up-reason') || '';
    var fuAction = rd('contact-follow-up-action') || '';
    var pts      = getModalPointsList();
    var fuNotes  = fuReason + (fuAction ? (fuReason ? ' | Next action: ' : 'Next action: ') + fuAction : '');
    var summary  = 'Method: ' + method + ' | Person: ' + (person || '—') +
                   ' | Outcome: ' + outcome + ' | Notes: ' + (notes || '—');
    actId = 'ACT-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100);
    payload = {
      merchantId: currentMerchant.id, contactMethod: method, contactPerson: person,
      outcome: outcome, notes: notes, summary: summary,
      createFollowUp: createFU,
      followUpDate: createFU ? fuDate : '',
      followUpNotes: createFU ? fuNotes : '',
      discussionPoints: pts
    };
  } catch (err) {
    showToast('Contact read error: ' + (err && err.message ? err.message : err));
    return;
  }
  try {
    currentMerchant.pipeline = 'Contact';
    currentMerchant.activities.unshift({
      id: actId, action: 'Contact', type: (payload.contactMethod || 'Contact') + ' Contact',
      timestamp: getFormattedNow(), date: getFormattedDateToday(), time: getFormattedTimeNow(),
      notes: payload.summary, summary: payload.summary, contactPerson: payload.contactPerson,
      rep: currentMerchant.salesRep, salesRep: currentMerchant.salesRep,
      outcome: payload.outcome, pipelineAfter: 'Contact'
    });
    if (payload.createFollowUp) {
      currentMerchant.followUps.unshift({
        id: 'FU-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
        date: payload.followUpDate, reason: payload.followUpNotes,
        nextAction: payload.followUpNotes, status: 'Pending'
      });
    }
    if (payload.contactPerson) currentMerchant.contactPerson = payload.contactPerson;
    updateUI();
  } catch (e) {}
  closeModal('contact-modal');
  if (isGAS()) {
    google.script.run
      .withSuccessHandler(function(){
        showToast('Contact saved! ID: ' + actId);
        google.script.run
          .withSuccessHandler(function(p){ if (p) { applyProfile(p); updateUI(); } })
          .withFailureHandler(function(){})
          .getMerchantProfileForPanel(currentMerchant.id);
      })
      .withFailureHandler(function(e){ showToast('Save failed: ' + (e && e.message ? e.message : e)); })
      .logContactFromPanel(payload);
  } else {
    showToast('Contact logged! ID: ' + actId);
  }
}

function submitFollowUpLog() {
  const reason = document.getElementById('follow-up-reason-input').value || 'Follow up on contact';
  const outcome = document.getElementById('follow-up-outcome-select').value;
  const createAnother = document.getElementById('follow-up-create-another').value === 'YES';

  currentMerchant.pipeline = 'Follow Up';

  currentMerchant.followUps.unshift({
    id: 'FU-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
    date: getFormattedNow(), reason: reason, nextAction: 'Confirm next steps', status: 'Completed'
  });
  currentMerchant.activities.unshift({
    id: actId, action: 'Follow Up', type: 'Follow-up Executed',
    timestamp: getFormattedNow(), date: getFormattedDateToday(), time: getFormattedTimeNow(),
    notes: `Reason: ${reason}. Outcome: ${outcome}`,

/* ═══ SYNC & BRANCH HELPERS ═════════════════════════════════════ */

function refreshActiveSheetRow() {
  const icon = document.getElementById('sync-icon');
  if (icon) icon.classList.add('animate-spin');
  if (isGAS()) {
    google.script.run
      .withSuccessHandler(function(profile) {
        if (profile) applyProfile(profile);
        if (icon) icon.classList.remove('animate-spin');
        updateUI(); showToast('Synced with sheet');
      })
      .withFailureHandler(function(err) {
        if (icon) icon.classList.remove('animate-spin');
        showToast('Sync error: ' + err);
      })
      .getActiveMerchantProfileForPanel();
  } else {
    setTimeout(() => {
      if (icon) icon.classList.remove('animate-spin');
      updateUI(); showToast('Synced Preview');
    }, 600);
  }
}

function toggleNewMerchantBranchFields() {
  const type = document.getElementById('new-mch-branch-type').value;
  const section = document.getElementById('new-mch-multi-branch-section');
  const branchesInput = document.getElementById('new-mch-branches');
  if (type === 'Single') {
    if (branchesInput) { branchesInput.value = 1; branchesInput.disabled = true; }
    if (section) section.classList.add('hidden');
  } else {
    if (branchesInput) branchesInput.disabled = false;
    if (section) section.classList.remove('hidden');
    renderBranchEntryFields();
  }
}

function renderBranchEntryFields() {
  const container = document.getElementById('new-mch-branch-entries');
  const count = parseInt(document.getElementById('new-mch-branches').value) || 1;
  const type = document.getElementById('new-mch-branch-type').value;
  if (!container || type !== 'Multi Branch') return;
  let html = '';
  for (let i = 1; i <= count; i++) {
    html += `
      <div class="flex gap-2">
        <input type="text" placeholder="Branch ${i} name / location" class="nx-input flex-1">
        <input type="text" placeholder="Phone" class="nx-input w-24">
      </div>
    `;
  }
  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  updateSubCategories('new-mch-main-category','new-mch-sub-category','new-mch-cat-scope');
  updateUI();
  refreshActiveSheetRow();

  // Enter = Add point (all three DP modals)
  [['contact-dp-input','contact'],['fu-dp-input','fu'],['mtg-dp-input','mtg']].forEach(([id, p]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addModalPoint(p); }
    });
  });

  // Enter = Add feedback (feedback tab)
  const fbi = document.getElementById('feedback-text-input');
  if (fbi) fbi.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitDirectFeedback(); }
  });

  // Ctrl+Enter = Save contact
  const notes = document.getElementById('contact-notes-input');
  if (notes) notes.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitContactLog(); }
  });
});

/* ── Auto-hide bottom nav: appears on scroll / tab switch, rests when idle ── */
let navIdleTimer = null;
function pokeBottomNav() {
  const nav = document.querySelector('.bottom-nav');
  if (!nav) return;
  nav.classList.add('is-visible');
  if (navIdleTimer) clearTimeout(navIdleTimer);
  navIdleTimer = setTimeout(() => nav.classList.remove('is-visible'), 1500);
}
window.addEventListener('scroll', pokeBottomNav, { passive: true, capture: true });
document.addEventListener('DOMContentLoaded', () => pokeBottomNav());
