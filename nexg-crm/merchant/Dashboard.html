/* layered ambient field */
body::before { content: ""; position: fixed; inset: 0; z-index: -3; pointer-events: none;
  background: radial-gradient(680px 420px at 84% -8%, rgba(212,175,55,.13), transparent 60%),
             radial-gradient(560px 380px at -6% 14%, rgba(201,119,47,.07), transparent 60%),

<body>
<div id="grain"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d878"/><stop offset="1" stop-color="#b8941f"/></linearGradient>
  <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(212,175,55,.4)"/><stop offset="1" stop-color="rgba(212,175,55,0)"/></linearGradient>
</defs></svg>

<div class="wrap" id="app">
  <div class="flex items-center justify-center h-screen">
    <div class="text-gold font-mono animate-pulse">Loading NEXG Intelligence...</div>
  </div>
</div>

<div id="tip"></div>
<div id="modal-root"></div>

<script>

// =====================================================================
// 1. STATE & CONFIGURATION
// =====================================================================
const State = {
  data: null,
  isLoading: true,
  error: null,
  modalStack: [],
  searchQuery: '',
  searchStage: 'All'
};

const CONFIG = {
  PIPE_FWD: ['Lead','Contact','Follow Up','Meeting','Demo','Proposal','Negotiation','Contract','Onboarding','Live'],
  STAGE_COLORS: {Lead:'#9aa3ad',Contact:'#d4af37','Follow Up':'#e0a93b',Meeting:'#c9772f',Demo:'#5aa39a',Proposal:'#5aa39a',Negotiation:'#c2607a',Contract:'#6f8aa8',Onboarding:'#6fa37a',Live:'#f0d878',Lost:'#ef4444'},
  CAT_COLORS: ['#d4af37','#e0a93b','#c9772f','#5aa39a','#6f8aa8','#c2607a','#9aa3ad'],
  AV_GRAD: ['linear-gradient(135deg,#d4af37,#8a6d1f)','linear-gradient(135deg,#9aa3ad,#5b6470)','linear-gradient(135deg,#c9772f,#7a4416)','linear-gradient(135deg,#5aa39a,#2f635c)','linear-gradient(135deg,#6f8aa8,#3f5168)','linear-gradient(135deg,#c2607a,#7a3a4c)']
};

// =====================================================================
// 2. UTILITIES
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const hexA = (h,a) => { const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
const hash = s => { let h=0; for(let i=0;i<(s||'').length;i++) h=(h*31+(s.charCodeAt(i)||0))>>>0; return h; };
const initials = s => ((s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
const avGrad = s => CONFIG.AV_GRAD[hash(s)%CONFIG.AV_GRAD.length];
const avatar = (s,cls='') => `<div class="av ${cls}" style="background:${avGrad(s)}">${esc(initials(s))}</div>`;

const debounce = (func, wait) => {
  let timeout;
  return (...args) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
};

function health(idle) {
  if(idle==null) return {t:'—',c:'var(--faint)'};
  if(idle<7) return {t:idle+'d',c:'var(--gold)'};
  if(idle<14) return {t:idle+'d',c:'var(--ember)'};
  if(idle<30) return {t:idle+'d',c:'var(--rose)'};
  return {t:idle+'d',c:'var(--red)'};
}
function healthLabel(idle) {
  if(idle==null) return '—';
  if(idle<7) return 'Active';
  if(idle<14) return 'Warming';
  if(idle<30) return 'Stale';
  return 'Cold';
}
function stageTag(st) {
  const c = CONFIG.STAGE_COLORS[st]||'#9aa3ad';
  return `<span class="stagetag" style="color:${c};border-color:${hexA(c,.32)};background:${hexA(c,.12)}">${esc(st)}</span>`;
}
function idleBadge(idle) {
  const h = health(idle);
  const color = h.c==='#ef4444'?'#ef4444':h.c==='var(--gold)'?'#d4af37':h.c==='var(--ember)'?'#c9772f':'#c2607a';
  return `<span class="idlebadge" style="color:${h.c};background:${hexA(color,.1)}">${healthLabel(idle)}</span>`;
}

// =====================================================================
// 3. DATA FETCHING
// =====================================================================
function fetchData() {
  State.isLoading = true;
  render();
  try {
    google.script.run
      .withSuccessHandler(data => {
        State.data = data;
        State.isLoading = false;
        State.error = null;
        render();
      })
      .withFailureHandler(err => {
        State.isLoading = false;
        State.error = err.message || "Failed to load data";
        render();
      })
      .getDashboardData();
  } catch (e) {
    State.isLoading = false;
    State.error = "Google Apps Script environment not detected or function missing.";
    render();
  }
}

// =====================================================================
// 4. RENDERING ENGINE (Component-like)
// =====================================================================
function render() {
  const app = $('app');
  if (State.isLoading) {
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="text-gold font-mono" style="animation:pulse 2s infinite">Loading NEXG Intelligence...</div></div>`;
    return;
  }
  if (State.error) {
    app.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px"><div class="text-red font-mono text-xl">Error: ${esc(State.error)}</div><button class="ibtn" onclick="fetchData()">Retry</button></div>`;
    return;
  }

  const D = State.data;
  app.innerHTML = `
    ${renderTopbar(D)}
    <div class="grid">
      ${renderHeroKPI(D)}
      ${renderStandardKPIs(D)}
      ${renderEmailCard()}
      ${renderPipeline(D)}
      ${renderDonut(D)}
      ${renderLeaderboard(D)}
      ${renderTrend(D)}
      ${renderSentiment(D)}
      ${renderOverdue(D)}
      ${renderRecent(D)}
    </div>
    ${renderFooter(D)}
  `;

  requestAnimationFrame(() => {
    animateGauge(D.kpi.winRate);
    animateCounters();
    attachCardFx();
    initEventDelegation();
    populateDynamicParts();
    loadEmailCard();
  });
}

function renderTopbar() {
  return `
    <div class="topbar">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
        <div><h1>NEXG</h1><div class="sub">sales intelligence, live</div></div>
      </div>
      <div class="topright">
        <button class="searchpill" onclick="openSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>Search merchants<kbd>⌘K</kbd></button>
        <span class="live"><i></i> Live</span>
        <div class="asof"><div class="lbl">As of</div><div class="clk" id="clock">—</div></div>
        <button class="ibtn ghost" onclick="expandDash()" title="Open in own tab / fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
        <button class="ibtn" id="refreshBtn" onclick="refreshDash()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
      </div>
    </div>
  `;
}

function renderHeroKPI(D) {
  return `
    <div class="card s4 hero" style="animation-delay:.02s">
      <div class="eyebrow"><b>Win Rate</b></div>
      <div class="row">
        <div class="gauge">
          <svg viewBox="0 0 140 140">
            <circle class="track" cx="70" cy="70" r="58" stroke-width="11" fill="none"/>
            <circle class="arc" id="gArc" cx="70" cy="70" r="58" stroke-width="11" fill="none"/>
            <circle class="knob" id="gKnob" cx="70" cy="12" r="5"/>
          </svg>
          <div class="ctr"><div class="v" id="gVal">0%</div><div class="u">closed</div></div>
        </div>
        <div class="meta">
          <div class="big">Pipeline → Live</div>
          <div class="small" id="gSub"><b>0</b> of <b>0</b> merchants converted</div>
        </div>
      </div>
    </div>
  `;
}

function renderStandardKPIs(D) {
  const kpis = [

function emailCountUp(el, target) {
  if (!el) return;
  const dur = 900, t0 = performance.now();
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function animateCounters() {
  document.querySelectorAll('.num[data-target]').forEach(el => {
    const target = parseFloat(el.dataset.target);
    const isPct = el.dataset.pct === 'true';
    const dur = 900, t0 = performance.now();
    function step(now) {
      const p = Math.min((now - t0) / dur, 1);
      const v = Math.round(target * (1 - Math.pow(1 - p, 3)));
      el.innerText = isPct ? v + '%' : v.toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function animateGauge(wr) {
  const R = 58, C = 2 * Math.PI * R;
  const arc = $('gArc'), knob = $('gKnob');
  if (!arc || !knob) return;
  arc.style.strokeDasharray = C;
  arc.style.strokeDashoffset = C;
  const dur = 1200, t0 = performance.now();
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    const val = wr * (1 - Math.pow(1 - p, 3));
    arc.style.strokeDashoffset = C * (1 - val);
    const ang = (-90 + 360 * val) * Math.PI / 180;
    knob.setAttribute('cx', 70 + R * Math.cos(ang));
    knob.setAttribute('cy', 70 + R * Math.sin(ang));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function attachCardFx() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.innerWidth < 720) return;
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      card.style.setProperty('--ry', (((e.clientX - r.left) / r.width - .5) * 4).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (((e.clientY - r.top) / r.height - .5) * -4).toFixed(2) + 'deg');
    });
    card.addEventListener('pointerleave', () => {
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    });
  });
}

let donutState = { circles: [], total: 0 };
function buildDonut(cats, total) {
  const svg = $('donut'), leg = $('legend');
  if (!svg || !leg) return;
  svg.innerHTML = ''; leg.innerHTML = '';
  $('donutTotal').innerText = total;
  donutState = { circles: [], total: total };

  if (!total) {
    svg.innerHTML = '<circle cx="70" cy="70" r="58" fill="none" stroke="#26262e" stroke-width="17"/>';
    leg.innerHTML = '<div class="empty">No merchants</div>';
    return;
  }

  const R = 58, C = 2 * Math.PI * R;
  let cum = 0;
  cats.forEach((c, i) => {
    const frac = c.count / total, dash = frac * C;
    const color = CONFIG.CAT_COLORS[i % CONFIG.CAT_COLORS.length];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', 70); circle.setAttribute('cy', 70); circle.setAttribute('r', R);
    circle.setAttribute('stroke', color); circle.setAttribute('stroke-dasharray', '0 ' + C);
    circle.setAttribute('transform', `rotate(${cum * 360 - 90} 70 70)`);
    circle.dataset.cat = c.name;
    svg.appendChild(circle);
    donutState.circles.push({ el: circle, dash: dash, name: c.name, count: c.count, pct: c.pct });
    cum += frac;

    const row = document.createElement('div');
    row.className = 'leg'; row.dataset.cat = c.name;
    row.innerHTML = `<span class="dot" style="background:${color}"></span><span class="nm">${esc(c.name)}</span><span class="pc">${c.pct}%</span>`;
    leg.appendChild(row);
  });

  donutState.circles.forEach((o, i) => setTimeout(() => {
    o.el.setAttribute('stroke-dasharray', o.dash + ' ' + (C - o.dash));
  }, 200 + i * 90));
}

function buildTrend(t) {
  const box = $('trend');
  if (!box) return;
  const W = 460, H = 158, pL = 12, pR = 12, pT = 16, pB = 26;
  const maxV = Math.max(1, ...t.map(d => Math.max(d.merchants, d.conversions)));
  const n = t.length, sx = (W - pL - pR) / (n - 1 || 1);
  const X = i => pL + i * sx, Y = v => pT + (H - pT - pB) * (1 - v / maxV);

  let line = '', cline = '', dots = '', xl = '', gl = '';
  t.forEach((d, i) => {
    const x = X(i), y = Y(d.merchants), cy = Y(d.conversions);
    line += (i ? 'L' : 'M') + x + ' ' + y + ' ';
    cline += (i ? 'L' : 'M') + x + ' ' + cy + ' ';
    dots += `<circle class="dot" cx="${x}" cy="${y}" r="3.4" data-i="${i}"/>`;
    xl += `<text class="xl" x="${x}" y="${H - 7}" text-anchor="middle">${d.label}</text>`;
    if (d.merchants > 0) gl += `<text class="gl" x="${x}" y="${y - 8}" text-anchor="middle">${d.merchants}</text>`;
  });

  const area = 'M' + X(0) + ' ' + (H - pB) + ' ' + t.map((d, i) => 'L' + X(i) + ' ' + Y(d.merchants)).join(' ') + ' L' + X(n - 1) + ' ' + (H - pB) + ' Z';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><line class="guide" id="tGuide" x1="0" y1="${pT}" x2="0" y2="${H - pB}"/><path class="area" d="${area}" fill="url(#areaG)"/><path class="cline" d="${cline}"/><path class="line" id="tLine" d="${line}"/>${dots}${gl}${xl}</svg>`;

  const path = $('tLine'), len = path.getTotalLength();
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  requestAnimationFrame(() => {
    path.style.transition = 'stroke-dashoffset 1.3s ease .2s';
    path.style.strokeDashoffset = 0;
    box.classList.add('show');
  });
  box._t = t; box._X = X;
}

function pushModal(html) {

function renderModals() {
  const root = $('modal-root');
  if (!root) return;
  document.body.classList.toggle('modal-open', State.modalStack.length > 0);

  if (State.modalStack.length === 0) { root.innerHTML = ''; return; }

  root.innerHTML = State.modalStack.map((h, i) => `
    <div class="mov" style="z-index:${4000 + i}" role="dialog" aria-modal="true">
      <div class="mob" onclick="popModal()"></div>
      <div class="mos ${i === State.modalStack.length - 1 ? 'top' : ''}">${h}</div>
    </div>
  `).join('');

  const last = root.querySelector('.mov:last-child .mb');
  if (last) {
    const inp = last.querySelector('input');
    if (inp) setTimeout(() => inp.focus(), 50);
  }
}

function drillStage(stage) {
  const list = State.data.merchants.filter(m => m.stage === stage).sort((a, b) => a.idle - b.idle);
  const p = State.data.pipeline.find(x => x.stage === stage) || {};
  const sub = `${list.length} merchant${list.length !== 1 ? 's' : ''}${p.step != null ? ' · ' + p.step + '% step conversion' : ''}`;
  pushModal(modalHead('Pipeline stage', stage, sub) + `<div class="mb">${list.length ? `<div class="mlist">${list.map(memberRow).join('')}</div>` : '<div class="empty">No merchants in this stage</div>'}</div>`);
}

function drillCategory(name) {
  const list = State.data.merchants.filter(m => m.cat === name);
  const c = State.data.categories.find(x => x.name === name) || {};
  pushModal(modalHead('Category', name, `${list.length} merchants · ${c.pct || 0}% of pipeline`) + `<div class="mb">${list.length ? `<div class="mlist">${list.map(memberRow).join('')}</div>` : '<div class="empty">No merchants here</div>'}</div>`);

function drillRep(name) {
  const list = State.data.merchants.filter(m => m.rep === name);
  const r = State.data.reps.find(x => x.name === name) || {};
  const dist = {};
  CONFIG.PIPE_FWD.concat(['Lost']).forEach(s => dist[s] = 0);
  list.forEach(m => { if (dist[m.stage] != null) dist[m.stage]++; });

  const total = list.length || 1;
  let bar = '', legend = '';
  CONFIG.PIPE_FWD.concat(['Lost']).forEach(s => {
    if (!dist[s]) return;
    const c = CONFIG.STAGE_COLORS[s];
    bar += `<i style="width:${dist[s] / total * 100}%;background:${c}"></i>`;
    legend += `<span><i style="background:${c}"></i>${s} ${dist[s]}</span>`;
  });

  pushModal(modalHead('Sales representative', name, `${r.activities || 0} activities · ${r.meetings || 0} meetings · ${r.won || 0} won`, avatar(name, 'lg')) + `<div class="mb">
    <div style="margin-bottom:6px">
      <div class="eyebrow" style="margin-bottom:8px">Stage distribution · ${list.length} merchants</div>
      <div class="detbar">${bar || '<i style="width:100%;background:var(--line)"></i>'}</div>
      <div class="detlegend">${legend}</div>
    </div>
    <div class="divline"></div>
    <div class="mlist" style="margin-top:14px">${list.length ? list.map(memberRow).join('') : '<div class="empty">No merchants assigned</div>'}</div>
  </div>`);
}

      </div>
      <div class="chips" id="mchips">${chips}</div>
      <div class="mlist" id="mlist"></div>
    </div>
  `;

  if (State.modalStack.length > 0 && State.modalStack[State.modalStack.length - 1].includes('msearchInput')) {
    State.modalStack[State.modalStack.length - 1] = head + `<div class="mb">${body}</div>`;
  } else {
    pushModal(head + `<div class="mb">${body}</div>`);
  }

  filterSearchList();
  setTimeout(() => {
    const inp = $('msearchInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }, 50);
}

const handleSearchInput = debounce((value) => {
  State.searchQuery = value;
  filterSearchList();
}, 300);

function setSearchStage(stage) {
  State.searchStage = stage;
  renderSearchModal();
}

function filterSearchList() {
  const q = State.searchQuery.toLowerCase();
  let list = State.data.merchants.filter(m =>
    (State.searchStage === 'All' || m.stage === State.searchStage) &&
    (!q || (m.name + ' ' + m.id + ' ' + m.rep + ' ' + m.cat).toLowerCase().includes(q))
  );
  list.sort((a, b) => a.idle - b.idle);

  const el = $('mlist');
  if (el) {
    el.innerHTML = list.length
      ? list.slice(0, 120).map(memberRow).join('') + (list.length > 120 ? `<div class="empty">+${list.length - 120} more — refine your search</div>` : '')
      : '<div class="empty">No merchants match</div>';
  }
}

// =====================================================================
// 10. EVENT DELEGATION & GLOBAL HANDLERS
// =====================================================================
function initEventDelegation() {
  const flow = $('flow');
  if (flow) {
    flow.addEventListener('click', e => { const c = e.target.closest('.fcol'); if (c) drillStage(c.dataset.stage); });
    flow.addEventListener('mouseover', e => {
      const c = e.target.closest('.fcol');
      if (!c) return;
      const p = State.data.pipeline.find(x => x.stage === c.dataset.stage);
      if (p) showTip(e, p.stage, p.count + ' merchants', p.pct + '% of pipeline' + (p.step != null ? ' · ' + p.step + '% from prev' : ''));
    });
    flow.addEventListener('mousemove', e => { if ($('tip').classList.contains('show')) moveTip(e); });
    flow.addEventListener('mouseout', e => { if (e.target.closest('.fcol')) hideTip(); });
    flow.querySelectorAll('.fbar').forEach(bar => setTimeout(() => { bar.style.height = bar.dataset.height + 'px'; }, 120));
  }

  const dz = $('donut-zone');
  if (dz) {
    dz.addEventListener('mouseover', e => { const t = e.target.closest('[data-cat]'); if (t) donutHi(t.dataset.cat); });
    dz.addEventListener('mouseout', e => { const t = e.target.closest('[data-cat]'); if (t && !e.relatedTarget?.closest?.('[data-cat]')) donutLo(); });
    dz.addEventListener('mouseleave', donutLo);
    dz.addEventListener('click', e => { const t = e.target.closest('[data-cat]'); if (t) drillCategory(t.dataset.cat); });
  }

  document.addEventListener('click', e => {
    const ov = e.target.closest('.ov'); if (ov) { drillMerchant(ov.dataset.mid); return; }
    const fi = e.target.closest('.fi'); if (fi && fi.dataset.mid) { drillMerchant(fi.dataset.mid); return; }
    const mr = e.target.closest('.mrow2'); if (mr) { drillMerchant(mr.dataset.mid); return; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && State.modalStack.length) popModal();
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  });
}

function handleKpiClick(id) {
  if (id === 'merchants' || id === 'act') openSearch();
  else if (id === 'live') drillStage('Live');
  else if (id === 'lost') drillStage('Lost');
  else if (id === 'overdue' || id === 'pending') {
    $('overdue').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('overdue').classList.add('flash');
    setTimeout(() => $('overdue').classList.remove('flash'), 900);
  }
}

// =====================================================================
// 11. UTILITIES (Tooltip, Toast, Clock, etc.)
// =====================================================================
function showTip(e, title, val, sub) {
  const tip = $('tip');
  tip.innerHTML = `<div class="tt">${esc(title)}</div><div class="tv">${esc(val)}</div>${sub ? `<div class="ts">${esc(sub)}</div>` : ''}`;
  tip.classList.add('show');
  moveTip(e);
}
function moveTip(e) {
  const tip = $('tip');
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 230) + 'px';
  tip.style.top = (e.clientY + 16) + 'px';
}
function hideTip() { $('tip').classList.remove('show'); }

function donutHi(name) {
  donutState.circles.forEach(o => {
    const on = o.name === name;
    o.el.classList.toggle('dim', !on);
    o.el.classList.toggle('hot', on);
  });
  const o = donutState.circles.find(x => x.name === name);
  if (o) { $('donutTotal').innerText = o.count; $('donutU').innerText = o.name; }
  document.querySelectorAll('#legend .leg').forEach(l => l.classList.toggle('on', l.dataset.cat === name));
}
function donutLo() {
  donutState.circles.forEach(o => { o.el.classList.remove('dim', 'hot'); });
  $('donutTotal').innerText = donutState.total;
  $('donutU').innerText = 'merchants';
  document.querySelectorAll('#legend .leg').forEach(l => l.classList.remove('on'));
}

function copyId(id) {
  try { navigator.clipboard.writeText(id); } catch (e) {
    const t = document.createElement('textarea'); t.value = id; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (_) {} t.remove();
  }
  toast('Copied ' + id);
}
function viewSheet() {
  if (State.data.sheetUrl) window.open(State.data.sheetUrl, '_blank');
  else toast('Sheet URL unavailable');
}
function expandDash() {
  if (window.self !== window.top) {
    try { google.script.run.withSuccessHandler(u => { if (u) window.open(u, '_blank'); else toast('Deploy as web app to pop out'); }).getWebAppUrl(); } catch (e) { toast('GAS context required'); }
  } else {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
function refreshDash() {
  const b = $('refreshBtn');
  if (b) b.classList.add('spin');
  try {
    google.script.run.withSuccessHandler(D => {
      if (b) b.classList.remove('spin');
      State.data = D;
      render();
      toast('Refreshed · ' + D.generatedAt);
    }).withFailureHandler(() => { if (b) b.classList.remove('spin'); toast('Refresh failed'); }).getDashboardData();
  } catch (e) { if (b) b.classList.remove('spin'); toast('Refresh failed'); }
}

let toastT;
function toast(msg) {
  let t = $('dashtoast');
  if (!t) {
    t = document.createElement('div'); t.id = 'dashtoast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:6000;background:#0c0c10;border:1px solid rgba(212,175,55,.35);border-radius:12px;padding:11px 18px;font-family:var(--body);font-size:12px;font-weight:800;color:var(--gold);box-shadow:0 14px 36px rgba(0,0,0,.6);opacity:0;transition:.3s';
    document.body.appendChild(t);
  }
  t.innerText = msg;
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
}

// =====================================================================
// 12. INITIALIZATION & DYNAMIC POPULATION
// =====================================================================
function tick() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const clk = $('clock');
  if (clk) clk.innerText = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
setInterval(tick, 1000); tick();

function populateDynamicParts() {
  const D = State.data;
  if (!D) return;

  $('gSub').innerHTML = `<b>${D.kpi.live}</b> of <b>${D.kpi.merchants}</b> merchants converted`;
  $('pmPct').innerText = Math.round(D.kpi.winRate * 100) + '%';
  $('pmBar').style.width = Math.round(D.kpi.winRate * 100) + '%';

  buildDonut(D.categories, D.kpi.merchants);

  const lb = $('lb');
  if (lb) {
    if (!D.reps.length) lb.innerHTML = '<div class="empty">No rep activity yet</div>';
    else {
      const mx = Math.max(...D.reps.map(r => r.activities + r.meetings));
      lb.innerHTML = D.reps.map((r, i) => {
        const tot = r.activities + r.meetings;
        return `<div class="lrow" data-rep="${esc(r.name)}" tabindex="0">${avatar(r.name, 'sm')}<div class="rk">${i + 1}</div><div class="mid"><div class="nm">${esc(r.name)}</div><div class="trk"><i style="width:0%" data-w="${Math.round((tot / mx) * 100)}%"></i></div></div><div><div class="ct">${tot}</div><div class="meta">${r.meetings} mtg · ${r.won} won</div></div></div>`;
      }).join('');
      setTimeout(() => lb.querySelectorAll('.trk i').forEach(i => i.style.width = i.dataset.w), 200);
    }
  }

  buildTrend(D.trend);

  const s = D.sentiment, totS = s.positive + s.neutral + s.negative || 1;
  $('sPos').innerText = s.positive; $('sNeu').innerText = s.neutral; $('sNeg').innerText = s.negative;
  $('warmPct').innerText = Math.round(s.positivity * 100) + '%';
  setTimeout(() => {
    $('sbP').style.width = (s.positive / totS * 100) + '%';
    $('sbN').style.width = (s.neutral / totS * 100) + '%';
    $('sbX').style.width = (s.negative / totS * 100) + '%';
  }, 100);

  const mom = $('mom');
  if (mom) {
    const maxD = Math.max(1, ...D.momentum.map(m => m.days || 0));
    const flame = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`;
    const thermo = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>`;
    const snow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>`;
    mom.innerHTML = D.momentum.map((m, i) => {
      if (m.days === null) return '';
      const c = m.days < 7 ? 'var(--gold)' : m.days < 14 ? 'var(--ember)' : 'var(--red)';
      const ic = m.days < 7 ? flame : m.days < 14 ? thermo : snow;
      return `<div class="mrow"><span class="mi" style="color:${c}">${ic}</span><span class="st">${esc(m.stage)}</span><div class="trk"><i style="background:${c};width:0%" data-w="${Math.max(6, Math.round((m.days / maxD) * 100))}%"></i></div><span class="dv" style="color:${c}">${m.days}d</span></div>`;
    }).join('') || '<div class="empty">No active stages</div>';
    setTimeout(() => mom.querySelectorAll('.trk i').forEach(i => i.style.width = i.dataset.w), 250);
  }

  const ov = $('overdue');
  if (ov) {
    if (!D.overdue.length) ov.innerHTML = '<div class="empty ok">All caught up ✓ — no overdue follow-ups</div>';
    else ov.innerHTML = D.overdue.map(o => `<div class="ov" data-mid="${esc(o.merchantId)}" tabindex="0"><span class="pd"></span><div class="info"><div class="nm">${esc(o.merchant)}</div><div class="rep">${avatar(o.rep || '?', 'sm')}${esc(o.rep || 'Unassigned')}</div></div><div class="rt"><div class="due">${esc(o.due.slice(0, 10))}</div><div class="dl">${o.late}d late</div></div></div>`).join('');
  }

  const fd = $('feed');
  if (fd) {
    if (!D.recent.length) fd.innerHTML = '<div class="empty">No activity yet — log your first contact</div>';
    else fd.innerHTML = D.recent.map(f => `<div class="fi ${f.kind}" data-mid="${esc(f.merchantId)}" tabindex="0"><div class="rail"><span class="d"></span><span class="ln"></span></div><div class="body"><div class="t">${esc(f.title)}</div><div class="m">${esc(f.time)} · ${esc(f.rep || '—')}</div></div></div>`).join('');
  }

  $('footGen').innerText = 'updated ' + D.generatedAt;
}

// =====================================================================
// EMAIL CONTROL CENTER — opens as an in-dashboard modal (no new tab).
// The Center runs inside an isolated iframe so its styles can never touch
// the dashboard (and vice-versa). It talks to the server through the
// parent page's google.script (see the one-line shim in EmailCenterJS.html).
// =====================================================================
function openEmailCenter() {
  pushModal(`
    <div data-xl>
      <div class="mh">
        <div class="mtxt">
          <div class="mk">communications</div>
          <div class="mt">Email Control Center</div>
          <div class="ms">render · dispatch · audit — all in one place</div>
        </div>
        <button class="mx" onclick="popModal()" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="nec-mount" style="position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-top:1px solid rgba(212,175,55,.28);"></div>
    </div>
  `);

  google.script.run
    .withSuccessHandler(function (html) {
      const m = document.getElementById('nec-mount');
      if (!m) return;
      m.innerHTML = html;
      try { Center.init(); } catch (e) { console.error('Email Center init failed:', e); }
    })
    .withFailureHandler(function (err) {
      const m = document.getElementById('nec-mount');
      if (m) m.innerHTML = '<div style="padding:40px;text-align:center;color:#888">Could not load the Email Center: ' + esc(err.message) + '</div>';
    })
    .getEmailCenterMarkup();

    
}

document.addEventListener('DOMContentLoaded', () => { fetchData(); });
</script>
