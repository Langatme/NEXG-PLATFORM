<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ▼ Stops Gmail/Outlook dark mode from inverting or greying any colours -->
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <title>NEXG Notification</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f7f6; font-family: Arial, sans-serif; -webkit-font-smoothing: antialiased;">

    <!-- Outer Wrapper for Background Color -->
    <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f7f6" style="background-color: #f4f7f6; padding: 30px 0;">
      <tr>
        <td align="center">

          <!-- Inner Container for the Email -->
          <table width="600" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; width: 100%;">

            <!-- HEADER — true charcoal black, hugs the logo, no bleed -->
            <tr>
              <td bgcolor="#0a0a0a" style="background-color: #0a0a0a; padding: 10px 24px; text-align: center; line-height: 0;">
                {{header_content}}
              </td>
            </tr>

            <!-- BODY CONTENT INJECTION POINT -->
            <tr>
              <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 40px 30px; color: #333333; font-size: 16px; line-height: 1.6;">
                {{email_body_content}}
              </td>
            </tr>

            <!-- FOOTER -->
            <tr>
              <td bgcolor="#f8f9fa" style="background-color: #f8f9fa; padding: 25px; text-align: center; font-size: 12px; color: #888888; border-top: 1px solid #eeeeee;">
                <p style="margin: 0 0 5px 0; font-weight: bold; color: #555555;">NEXG Dashboard</p>
                <p style="margin: 0;">&copy; {{current_year}} NEXG. All rights reserved.</p>
                <p style="margin: 10px 0 0 0; font-size: 11px; color: #aaaaaa;">This is an automated message from your NEXG management system.</p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>

  </body>
</html>
