<style>
/* ═══════════════════════════════════════════════════════════════
   NEXG MODAL FORM SYSTEM v5.0
   Pinned footer · Numbered sections · DP capture · Date/Time
   ═══════════════════════════════════════════════════════════════ */

/* ── Modal skeleton: head / scrolling body / PINNED action bar ── */
.modal-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 14px;
}
.modal-foot {
  flex-shrink: 0; position: relative;
  display: flex; gap: 8px;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(212,175,55,0.14);
  background: #111116;
}
.modal-foot::before {
  content:""; position:absolute; left:0; right:0; top:-14px; height:14px;
  background: linear-gradient(180deg, transparent, rgba(17,17,22,0.92));
  pointer-events: none;
}

/* ── Progressive numbered sections ─────────────────────────────── */
.form-sec { display:flex; flex-direction:column; gap:8px; animation:slideUp .24s ease both; }
.form-sec:nth-child(2){ animation-delay:.04s }
.form-sec:nth-child(3){ animation-delay:.08s }
.form-sec:nth-child(4){ animation-delay:.12s }
.form-sec:nth-child(5){ animation-delay:.16s }
.form-sec-head { display:flex; align-items:center; gap:8px; }
.form-step { font-family:"SF Mono","Fira Code",monospace; font-size:8px; font-weight:700;
             color:rgba(212,175,55,0.65); letter-spacing:.08em; }
.form-sec-title { font-size:9px; font-weight:900; text-transform:uppercase;
                  letter-spacing:.15em; color:rgba(255,255,255,.5); white-space:nowrap; }
.form-sec-line { flex:1; height:1px;
                 background:linear-gradient(90deg, rgba(255,255,255,.10), transparent); }
.form-panel { background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.05);
              border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:9px; }
.flabel { display:block; font-size:8px; font-weight:900; text-transform:uppercase;
          letter-spacing:.13em; color:rgba(255,255,255,.38); margin-bottom:5px; }

/* ── Sentiment segmented control ───────────────────────────────── */
.dp-sent-row { display:flex; gap:6px; }
.dp-sent-opt {
  flex:1; padding:6px 4px; border-radius:8px; cursor:pointer;
  font-size:9.5px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
  background:rgba(255,255,255,.03); color:#737373; border:1px solid rgba(255,255,255,.08);
  transition:all .15s ease;
}
.dp-sent-opt:hover { color:#e5e5e5; border-color:rgba(255,255,255,.16); }
.dp-sent-opt:active { transform:scale(.96); }
.dp-sent-opt.active { background:rgba(212,175,55,.12); color:#d4af37;
                      border-color:rgba(212,175,55,.32); box-shadow:0 0 10px rgba(212,175,55,.12); }
.dp-sent-opt[data-v="Negative"].active { background:rgba(239,68,68,.10); color:#ef4444;
                      border-color:rgba(239,68,68,.30); box-shadow:0 0 10px rgba(239,68,68,.10); }

/* ── Input row — min-width:0 kills the overflow ────────────────── */
.dp-input-row { display:flex; gap:6px; }
.dp-input { flex:1 1 auto; min-width:0 !important; }
.dp-add   { flex-shrink:0; padding:8px 14px !important; }

.dp-count { margin-left:auto; font-family:"SF Mono","Fira Code",monospace; font-size:8px;
            color:rgba(212,175,55,.75); background:rgba(212,175,55,.08);
            border:1px solid rgba(212,175,55,.18); padding:1px 7px; border-radius:999px; }

/* ── Point chips ───────────────────────────────────────────────── */
.modal-dp-list-container { counter-reset:dp; }

.dp-empty {
  padding:9px 8px; border:1px dashed rgba(255,255,255,.10); border-radius:10px;
  text-align:center; font-size:9.5px; font-style:italic; color:rgba(163,163,163,.4);
  animation:dpIn .25s both;
}

.dp-chip {
  counter-increment:dp; display:flex; align-items:center; gap:8px;
  padding:7px 8px 7px 10px; border-radius:10px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.07); border-left:3px solid rgba(255,255,255,.18);
  animation:dpIn .22s cubic-bezier(.22,1,.36,1) both; transition:transform .15s ease;
}
.dp-chip:hover { transform:translateX(2px); }
.dp-chip::before { content:counter(dp, decimal-leading-zero);
  font-family:"SF Mono","Fira Code",monospace; font-size:8px; font-weight:700;
  color:rgba(212,175,55,.55); flex-shrink:0; }
@keyframes dpIn { from { opacity:0; transform:translateX(-10px) scale(.97); } to { opacity:1; transform:none; } }
.dp-chip.dp-out { animation:dpOut .15s ease forwards; }
@keyframes dpOut { to { opacity:0; transform:translateX(14px) scale(.95); } }

.dp-pos { border-left-color:#d4af37; }
.dp-neu { border-left-color:rgba(255,255,255,.28); }
.dp-neg { border-left-color:#ef4444; }

.dp-text { flex:1; min-width:0; font-size:10.5px; font-weight:700;
           color:rgba(229,229,229,.88); line-height:1.35; }
.dp-sent { flex-shrink:0; font-size:8px; font-weight:900; letter-spacing:.06em;
           text-transform:uppercase; padding:2px 6px; border-radius:6px; border:1px solid; }
.dp-sent.pos { color:#d4af37; background:rgba(212,175,55,.10); border-color:rgba(212,175,55,.25); }
.dp-sent.neu { color:#a3a3a3; background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.10); }
.dp-sent.neg { color:#ef4444; background:rgba(239,68,68,.08);  border-color:rgba(239,68,68,.22); }

.dp-del { flex-shrink:0; width:18px; height:18px; border-radius:6px;
          display:flex; align-items:center; justify-content:center;
          font-size:9px; line-height:1; color:#737373; cursor:pointer;
          background:transparent; border:none; padding:0; opacity:0;
          transition:opacity .15s, background .15s, color .15s; }
.dp-chip:hover .dp-del { opacity:1; }
.dp-del:hover { background:rgba(239,68,68,.12); color:#ef4444; }
@media (hover:none) { .dp-del { opacity:.6; } }

.dp-new { animation:dpIn .22s both, dpFlash .6s ease-out; }
@keyframes dpFlash { 0% { box-shadow:0 0 0 0 rgba(212,175,55,.5); } 100% { box-shadow:0 0 0 10px rgba(212,175,55,0); } }

.nx-shake { animation:nxShake .3s ease; }
@keyframes nxShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)}
                     50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }

/* ── Time picker — matches the existing date picker theme ──────── */
input[type="time"] { color:#fff !important; }
input[type="time"]::-webkit-calendar-picker-indicator {
  opacity:.7; cursor:pointer;
  filter:invert(75%) sepia(22%) saturate(420%) hue-rotate(5deg);
}
input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity:1; }

/* ── Feedback tab raw stream — sentiment rails + stagger ───────── */
.dp-stream-card {
  border-left:3px solid transparent;
  animation:dpIn .24s cubic-bezier(.22,1,.36,1) both;
  transition:transform .15s ease;
}
.dp-stream-card:hover { transform:translateX(2px); }
.dp-rail-pos { border-left-color:#d4af37 !important; }
.dp-rail-neu { border-left-color:rgba(255,255,255,.22) !important; }
.dp-rail-neg { border-left-color:#ef4444 !important; }
</style>
