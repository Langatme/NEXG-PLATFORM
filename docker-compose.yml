services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexg-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200ms"
      - "-c"
      - "log_line_prefix=%t [%p] %q%u@%d "
    environment:
      POSTGRES_USER: nexg
      POSTGRES_PASSWORD: nexg_dev_password
      POSTGRES_DB: nexg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./nexg-backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexg -d nexg"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: nexg-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nexg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nexg-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/nexg-media;
      mc anonymous set download local/nexg-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
